<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="startGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="douyinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="reachGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ec4899"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="660" fill="url(#bg)" rx="12"/>

  <!-- 标题 -->
  <text x="480" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">多平台多设备同步 Obsidian 工作流</text>
  <line x1="280" y1="45" x2="680" y2="45" stroke="#334155" stroke-width="1"/>

  <!-- ===== 输入 ===== -->
  <rect x="355" y="58" width="250" height="46" rx="23" fill="url(#startGrad)" filter="url(#shadow)"/>
  <text x="480" y="87" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">🔗 多平台链接</text>

  <line x1="480" y1="104" x2="480" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- URL 解析 -->
  <rect x="355" y="133" width="250" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="157" text-anchor="middle" fill="#94a3b8" font-size="13">🌐 URL 解析 → 识别平台</text>

  <!-- 分叉线 -->
  <line x1="480" y1="171" x2="480" y2="195" stroke="#64748b" stroke-width="2"/>
  <line x1="190" y1="195" x2="770" y2="195" stroke="#64748b" stroke-width="1.5"/>

  <!-- 左分支 → 抖音 -->
  <line x1="190" y1="195" x2="190" y2="218" stroke="#ec4899" stroke-width="2" marker-end="url(#arrowPink)"/>
  <!-- 右分支 → agent-reach -->
  <line x1="770" y1="195" x2="770" y2="218" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- ===== 抖音卡片 ===== -->
  <rect x="90" y="222" width="200" height="110" rx="10" fill="#111827" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="90" y="222" width="200" height="30" rx="10" fill="url(#douyinGrad)"/>
  <rect x="90" y="242" width="200" height="10" fill="url(#douyinGrad)"/>
  <text x="190" y="243" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">douyin-mcp</text>
  <text x="190" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">🎵 抖音</text>

  <!-- ===== agent-reach 卡片 ===== -->
  <rect x="670" y="222" width="200" height="110" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="222" width="200" height="30" rx="10" fill="url(#reachGrad)"/>
  <rect x="670" y="242" width="200" height="10" fill="url(#reachGrad)"/>
  <text x="770" y="243" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">agent-reach</text>
  <text x="770" y="270" text-anchor="middle" fill="#94a3b8" font-size="12">📺 B站 · 📕 小红书 · ▶️ YouTube</text>
  <text x="770" y="292" text-anchor="middle" fill="#64748b" font-size="11">🐦 X · 🌍 通用网页 · 更多平台</text>

  <!-- 两路汇聚线 -->
  <line x1="190" y1="332" x2="190" y2="370" stroke="#ec4899" stroke-width="1.2"/>
  <line x1="770" y1="332" x2="770" y2="370" stroke="#8b5cf6" stroke-width="1.2"/>
  <line x1="190" y1="370" x2="770" y2="370" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="370" x2="480" y2="395" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- ===== AI 分析 ===== -->
  <rect x="310" y="398" width="340" height="50" rx="10" fill="url(#aiGrad)" filter="url(#shadow)"/>
  <text x="480" y="419" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🤖 AI 分析与总结</text>
  <text x="480" y="438" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">摘要 · 关键观点 · 原始内容 · 思考区</text>

  <line x1="480" y1="448" x2="480" y2="475" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- ===== 写入 Obsidian ===== -->
  <rect x="290" y="478" width="380" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="498" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">📝 写入 Obsidian Vault</text>
  <text x="480" y="514" text-anchor="middle" fill="#64748b" font-size="10">调用 Obsidian CLI 管理 Obsidian 笔记仓库</text>

  <line x1="480" y1="522" x2="480" y2="548" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- ===== FNS 同步 ===== -->
  <rect x="290" y="551" width="380" height="50" rx="10" fill="url(#syncGrad)" filter="url(#shadow)"/>
  <text x="480" y="572" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">🔄 FNS 同步服务</text>
  <text x="480" y="592" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">WebSocket 实时推送 · 自动检测文件变更</text>

  <!-- 分叉 -->
  <line x1="480" y1="601" x2="480" y2="618" stroke="#10b981" stroke-width="2"/>
  <line x1="330" y1="618" x2="630" y2="618" stroke="#10b981" stroke-width="1.5"/>
  <line x1="330" y1="618" x2="330" y2="632" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="630" y1="618" x2="630" y2="632" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Windows + Android -->
  <rect x="230" y="634" width="200" height="22" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="650" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">🖥️ Windows Obsidian</text>

  <rect x="530" y="634" width="200" height="22" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="630" y="650" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">📱 Android Obsidian</text>


</svg>
